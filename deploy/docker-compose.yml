# Docker Compose configuration for Pharmacy Desert Explorer
# 
# Usage:
#   docker-compose up -d        # Start in background
#   docker-compose logs -f      # View logs
#   docker-compose down         # Stop
#   docker-compose pull && docker-compose up -d  # Update

version: '3.8'

services:
  pharmacy-deserts:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: pharmacy-deserts
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - AWS_S3_BUCKET=${AWS_S3_BUCKET}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-true}
      - APP_PASSWORD=${APP_PASSWORD}
      - DATA_DIR=${DATA_DIR:-raw_data}
      - RESULTS_DIR=${RESULTS_DIR:-results}
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    # Use IAM role for S3 access (recommended for EC2)
    # If not using IAM role, uncomment and set these:
    # - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
    # - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Uncomment to mount local data (for development without S3)
    # volumes:
    #   - ../raw_data:/app/raw_data:ro
    #   - ../results:/app/results:ro

  # Optional: Nginx reverse proxy for HTTPS
  # Uncomment if you want to add SSL/HTTPS support
  # nginx:
  #   image: nginx:alpine
  #   container_name: nginx-proxy
  #   restart: unless-stopped
  #   ports:
  #     - "80:80"
  #     - "443:443"
  #   volumes:
  #     - ./nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./ssl:/etc/nginx/ssl:ro
  #   depends_on:
  #     - pharmacy-deserts

networks:
  default:
    name: pharmacy-deserts-network

